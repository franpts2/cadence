name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SPOTIFY_CLIENT_ID: ci-spotify-client-id
          SPOTIFY_CLIENT_SECRET: ci-spotify-client-secret
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-characters-long
          TURSO_DATABASE_URL: libsql://localhost
          TURSO_AUTH_TOKEN: ci-turso-token
          AUTH_TRUST_HOST: true

      - name: Test
        run: npm test
